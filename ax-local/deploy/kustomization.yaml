apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../.sources/ax/deploy/ax-server.yaml
  - redis.yaml
  - local-access.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ax-server
        namespace: ax-system
      spec:
        template:
          spec:
            containers:
              - name: ax-server
                env:
                  - name: AX_SNAPSHOTS_BUCKET
                    value: gs://ate-snapshots/ax-local/
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: ax-server
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ax-server
