apiVersion: v1
kind: Namespace
metadata:
  name: ax-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ax-model-secret-reader
  namespace: ax-demo
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [gemini-api-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ax-model-secret-reader
  namespace: ax-demo
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ax-model-secret-reader
