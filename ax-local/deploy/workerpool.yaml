apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax-local
  namespace: ax-demo
spec:
  replicas: 2
  sandboxClass: gvisor
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
  template:
    nodeSelector:
      ate.dev/substrate-version: "944abe32"
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
