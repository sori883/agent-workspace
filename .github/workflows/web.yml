name: Web workspace

on:
  pull_request:
    paths:
      - web/**
      - ax-local/**
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - web/**
      - ax-local/**
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_CONFIG_FILE: ${{ github.workspace }}/ax-local/.state/auth-test/app.json
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_PASSWORD: ax-app-ci-only
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prepare dedicated authentication database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE ax_app LOGIN PASSWORD 'ax-app-ci-only';"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE app_auth_test OWNER ax_app;'
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c 'REVOKE ALL ON DATABASE app_auth_test FROM PUBLIC;'
          node --import tsx tests/prepare-auth.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
