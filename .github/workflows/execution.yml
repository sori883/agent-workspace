name: Execution controller

on:
  pull_request:
    paths:
      - execution/**
      - .github/workflows/execution.yml
  push:
    branches: [main]
    paths:
      - execution/**
      - .github/workflows/execution.yml

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: execution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache-dependency-path: execution/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
