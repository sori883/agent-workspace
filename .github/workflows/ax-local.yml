name: AX local CLI

on:
  pull_request:
    paths:
      - ax-local/**
      - .github/workflows/ax-local.yml
  push:
    branches: [main]
    paths:
      - ax-local/**
      - .github/workflows/ax-local.yml

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ax-local/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s ax-local/keycloak -p 'test_*.py' -v
      - run: |
          for script in ax-local/task ax-local/ax ax-local/with-env.sh ax-local/scripts/*.sh ax-local/keycloak/start.sh; do
            bash -n "$script"
          done
